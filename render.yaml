# Render Blueprint: New > Blueprint > pick this repo.
# Free tier sleeps after 15 min idle; first request then takes ~1 min.
# Open /api/health a few minutes before the demo to wake it.
services:
  - type: web
    name: carrolinha-be
    runtime: python
    plan: free
    buildCommand: uv sync --frozen
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: PULSO_DB
        value: warehouse.duckdb
      # Keep the private journey database on server-side storage and point this
      # at its mounted path. Never publish it as a frontend/static asset.
      - key: CARROLINHA_JOURNEYS
        sync: false
      # Planner secrets: set in the Render dashboard, never here
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      # Comma-separated frontend origins allowed to call /api/planner
      - key: CARROLINHA_ALLOWED_ORIGINS
        sync: false
